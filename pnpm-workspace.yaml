# pnpm-workspace.yaml
packages:
  - "packages/*"
  - "packages/*/integrations"
  - "packages-private/*"
  - "packages-private/*/integrations"
  - "docs"
  - "docs/libs/*/*"
nodeLinker: hoisted
allowBuilds:
  '@parcel/watcher': false
  bun: true
  deno: true
  esbuild: true
minimumReleaseAgeExclude:
  - '@ttsc/paths@0.34.1'
