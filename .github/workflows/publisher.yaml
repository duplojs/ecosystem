name: Release

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: 'pnpm'
          node-version: '24.18.0'
          registry-url: 'https://registry.npmjs.org'
      - env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          VERSION=$(echo "$RELEASE_TAG" | sed -nE 's/^v([^[:space:]]+)$/\1/p')

          if [ -z "$VERSION" ]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

          if [[ "$VERSION" =~ -beta([.-]|$) ]]; then
            HAS_BETA=true
          else
            HAS_BETA=false
          fi

          if [ "$PRERELEASE" != "$HAS_BETA" ]; then
            echo "::error::Incoherent release: prerelease=$PRERELEASE, version=$VERSION"
            exit 1
          fi

          pnpm pkg set version="$VERSION"
          pnpm -r pkg set version="$VERSION"

      - run: pnpm ci
      - run: pnpm build
      - run: pnpm test:types

      - env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            pnpm -r stage publish --tag beta --access public --no-git-checks
          else
            pnpm -r stage publish --access public --no-git-checks
          fi