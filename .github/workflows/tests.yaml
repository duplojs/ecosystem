name: Tests

on: [pull_request]

jobs:
  build: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: 'pnpm'
          node-version: '24.18.0'
      - run: pnpm ci
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            packages/*/dist/**
            packages-private/*/dist/**

  unit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: .
      - uses: actions/setup-node@v7
        with:
          cache: 'pnpm'
          node-version: '24.18.0'
      - run: pnpm ci
      - run: pnpm test:ut
      - if: always()
        uses: davelosert/vitest-coverage-report-action@v2
  
  types:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: .
      - uses: actions/setup-node@v7
        with:
          cache: 'pnpm'
          node-version: '24.18.0'
      - run: pnpm ci
      - run: pnpm test:types

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: .
      - uses: actions/setup-node@v7
        with:
          cache: 'pnpm'
          node-version: '24.18.0'
      - run: pnpm ci
      - run: pnpm test:lint
